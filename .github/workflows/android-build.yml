name: Android Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: Build type
        options: [debug, release, bundle]
        default: debug
        required: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.5"

jobs:
  build:
    name: Build ${{ matrix.arch }} ${{ matrix.type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a]
        type: [debug, release]
        include:
          - arch: arm64-v8a
            ndk_version: "26.1.10909125"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: ${{ matrix.ndk_version }}
          cmdline-tools-version: "latest"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Assets
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets
          key: assets-${{ hashFiles('app/src/main/assets/**') }}

      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      - name: Setup Debug Keystore
        if: matrix.type == 'debug'
        run: |
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US" || true

      - name: Setup Release Keystore
        if: matrix.type == 'release'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Debug APK
        if: matrix.type == 'debug'
        run: ./gradlew :app:assembleDebug --no-daemon -Pabi=${{ matrix.arch }}

      - name: Build Release APK
        if: matrix.type == 'release'
        run: ./gradlew :app:assembleRelease --no-daemon -Pabi=${{ matrix.arch }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release Bundle (AAB)
        if: matrix.type == 'release'
        run: ./gradlew :app:bundleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megaapp-${{ matrix.arch }}-${{ matrix.type }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false

  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:lintDebug --no-daemon
      - run: ./gradlew :app:testDebugUnitTest --no-daemon

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath