name: Android Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: Build type
        options: [debug, release, bundle]
        default: debug
        required: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.5"
  ANDROID_SDK_VERSION: "35"
  NDK_VERSION: "26.1.10909125"

jobs:
  build:
    name: Build ${{ matrix.arch }} ${{ matrix.type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a]
        type: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        run: |
          # Install Android SDK platform and build tools
          sdkmanager "platforms;android-${{ env.ANDROID_SDK_VERSION }}" \
                     "build-tools;${{ env.ANDROID_SDK_VERSION }}.0.0" \
                     "platform-tools"
          # Install NDK
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          # Set ANDROID_NDK_HOME for Gradle
          echo "ANDROID_NDK_HOME=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -type d | tail -1)" >> $GITHUB_ENV
          # Add to PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/build-tools/$(ls /usr/local/lib/android/sdk/build-tools | tail -1)" >> $GITHUB_PATH

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Assets
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets
          key: assets-${{ hashFiles('app/src/main/assets/**') }}

      - name: Setup Debug Keystore
        if: matrix.type == 'debug'
        run: |
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US" || true

      - name: Setup Release Keystore
        if: matrix.type == 'release'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Debug APK
        if: matrix.type == 'debug'
        run: gradle :app:assembleDebug --no-daemon -Pabi=${{ matrix.arch }}

      - name: Build Release APK
        if: matrix.type == 'release'
        run: gradle :app:assembleRelease --no-daemon -Pabi=${{ matrix.arch }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release Bundle (AAB)
        if: matrix.type == 'release'
        run: gradle :app:bundleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megaapp-${{ matrix.arch }}-${{ matrix.type }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false

  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Setup Android SDK
        run: |
          sdkmanager "platforms;android-${{ env.ANDROID_SDK_VERSION }}" \
                     "build-tools;${{ env.ANDROID_SDK_VERSION }}.0.0" \
                     "platform-tools"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/build-tools/$(ls /usr/local/lib/android/sdk/build-tools | tail -1)" >> $GITHUB_PATH
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses
      - run: gradle :app:lintDebug --no-daemon
      - run: gradle :app:testDebugUnitTest --no-daemon

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Setup Android SDK
        run: |
          sdkmanager "platforms;android-${{ env.ANDROID_SDK_VERSION }}" \
                     "build-tools;${{ env.ANDROID_SDK_VERSION }}.0.0" \
                     "platform-tools"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/build-tools/$(ls /usr/local/lib/android/sdk/build-tools | tail -1)" >> $GITHUB_PATH
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses
      - run: gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon